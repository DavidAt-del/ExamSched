# Cloud Build pipeline. Triggered on push to `develop` (staging) and `main` (production).
# Env substitutions are expected to be set on the trigger:
#   _REGION, _PROJECT_ID, _AR_REPO, _CLOUD_SQL_INSTANCE, _ENV (staging|production)
substitutions:
  _REGION: us-central1
  _AR_REPO: proctor-scheduler
  _ENV: staging
  # Set this on the trigger to the full Cloud SQL instance connection name,
  # e.g. "my-project:us-central1:proctor-staging-pg".
  _CLOUD_SQL_INSTANCE: ''

options:
  # Bumped from the default e2-medium so the Testcontainers Postgres in the
  # integration step has headroom; the rest of the pipeline benefits too.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  env:
    - 'NODE_ENV=production'

steps:
  - id: install
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        npm ci --workspaces --include-workspace-root --no-audit --no-fund

  - id: secret-scan
    # Working-tree scan (--no-git): Cloud Build's checkout has no git history.
    # Add allowlist entries to .gitleaks.toml for known-safe placeholders.
    # Pinned to a release tag for reproducibility — bump deliberately when
    # rolling forward, never use `:latest` in CI.
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: gitleaks
    args:
      - detect
      - --redact
      - --no-git
      - --source=.
      - --config=.gitleaks.toml

  - id: lint
    name: node:22
    entrypoint: npm
    args: ['run', 'lint']

  - id: typecheck
    name: node:22
    entrypoint: npm
    args: ['run', 'typecheck']

  - id: test-unit
    name: node:22
    entrypoint: npm
    args: ['run', 'test:unit']

  - id: test-integration
    # Cloud Build mounts the host Docker socket only into cloud-builders/*
    # images, so we use the pinned cloud-builders/docker (which has the
    # daemon access Testcontainers needs) and add Node 22 via NodeSource's
    # signed APT repo. The repo is gated by a TLS-fetched GPG key + apt's
    # signed-by verification — no `curl | bash`. /workspace persists across
    # steps in Cloud Build, so the `install` step's node_modules are reused;
    # we don't re-run `npm ci` here.
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -qq -y --no-install-recommends ca-certificates curl gnupg
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update -qq
        apt-get install -qq -y --no-install-recommends nodejs
        npm run test:integration --workspace @app/api

  - id: build-api-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA}
      - .

  - id: build-web-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${SHORT_SHA}
      - .

  - id: push-api-image
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA}']

  - id: push-web-image
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${SHORT_SHA}']

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        # Migration job mirrors the API service's identity, env, secrets, and
        # VPC connectivity so it can reach private Cloud SQL with IAM auth.
        gcloud run jobs deploy api-migrate-${_ENV} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA} \
          --region ${_REGION} \
          --command node \
          --args "apps/api/dist/main.js" \
          --service-account api-${_ENV}@$PROJECT_ID.iam.gserviceaccount.com \
          --network proctor-${_ENV}-vpc \
          --subnet proctor-${_ENV}-subnet \
          --vpc-egress private-ranges-only \
          --set-env-vars "NODE_ENV=production,RUN_MIGRATIONS_ONLY=true,CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE},DB_USER=api-${_ENV}@$PROJECT_ID.iam,DB_NAME=proctor_scheduler" \
          --set-secrets "JWT_SECRET=proctor-${_ENV}-jwt-secret:latest" \
          --task-timeout 600 \
          --max-retries 1 \
          --quiet
        gcloud run jobs execute api-migrate-${_ENV} --region ${_REGION} --wait

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy api-${_ENV} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA} \
          --region ${_REGION} \
          --port 8080 \
          --allow-unauthenticated \
          --service-account api-${_ENV}@$PROJECT_ID.iam.gserviceaccount.com \
          --network proctor-${_ENV}-vpc \
          --subnet proctor-${_ENV}-subnet \
          --vpc-egress private-ranges-only \
          --set-env-vars "NODE_ENV=production,CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE},DB_USER=api-${_ENV}@$PROJECT_ID.iam,DB_NAME=proctor_scheduler" \
          --set-secrets "JWT_SECRET=proctor-${_ENV}-jwt-secret:latest,SENDGRID_API_KEY=proctor-${_ENV}-sendgrid-api-key:latest,EMAIL_FROM=proctor-${_ENV}-email-from:latest" \
          --quiet

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy web-${_ENV} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${SHORT_SHA} \
          --region ${_REGION} \
          --port 8080 \
          --allow-unauthenticated \
          --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${SHORT_SHA}

timeout: 1800s
