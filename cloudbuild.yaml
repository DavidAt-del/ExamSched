# Cloud Build pipeline. Triggered on push to `develop` (staging) and `main` (production).
# Env substitutions are expected to be set on the trigger:
#   _REGION, _PROJECT_ID, _AR_REPO, _CLOUD_SQL_INSTANCE, _ENV (staging|production)
substitutions:
  _REGION: us-central1
  _AR_REPO: proctor-scheduler
  _ENV: staging

options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - 'NODE_ENV=production'

steps:
  - id: install
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        npm ci --workspaces --include-workspace-root --no-audit --no-fund

  - id: lint
    name: node:22
    entrypoint: npm
    args: ['run', 'lint']

  - id: typecheck
    name: node:22
    entrypoint: npm
    args: ['run', 'typecheck']

  - id: test-unit
    name: node:22
    entrypoint: npm
    args: ['run', 'test:unit']

  - id: build-api-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA}
      - .

  - id: build-web-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${SHORT_SHA}
      - .

  - id: push-api-image
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA}']

  - id: push-web-image
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${SHORT_SHA}']

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs deploy api-migrate-${_ENV} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA} \
          --region ${_REGION} \
          --command node \
          --args "apps/api/dist/main.js" \
          --set-env-vars "NODE_ENV=production,RUN_MIGRATIONS_ONLY=true" \
          --task-timeout 600 \
          --max-retries 1 \
          --quiet
        gcloud run jobs execute api-migrate-${_ENV} --region ${_REGION} --wait

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy api-${_ENV} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA} \
          --region ${_REGION} \
          --port 8080 \
          --allow-unauthenticated \
          --service-account api-${_ENV}@$PROJECT_ID.iam.gserviceaccount.com \
          --quiet

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy web-${_ENV} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${SHORT_SHA} \
          --region ${_REGION} \
          --port 8080 \
          --allow-unauthenticated \
          --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${SHORT_SHA}

timeout: 1800s
