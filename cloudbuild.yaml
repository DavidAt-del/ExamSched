# Cloud Build pipeline. Triggered on push to `develop` (staging) and `main` (production).
# Override the substitutions below in the target GCP project's build trigger so
# the same pipeline can deploy into a different account / naming scheme.
substitutions:
  _REGION: us-central1
  _AR_REPO: proctor-scheduler
  _ENV: staging
  _DB_NAME: proctor_scheduler
  _API_SERVICE_ACCOUNT_ID: api-staging
  _WEB_SERVICE_ACCOUNT_ID: web-staging
  _API_SERVICE_NAME: api-staging
  _WEB_SERVICE_NAME: web-staging
  _MIGRATION_JOB_NAME: api-migrate-staging
  _VPC_NAME: proctor-staging-vpc
  _SUBNET_NAME: proctor-staging-subnet
  _JWT_SECRET_NAME: proctor-staging-jwt-secret
  _SENDGRID_SECRET_NAME: proctor-staging-sendgrid-api-key
  _EMAIL_FROM_SECRET_NAME: proctor-staging-email-from
  # Set this on the trigger to the full Cloud SQL instance connection name,
  # e.g. "my-project:us-central1:proctor-staging-pg".
  _CLOUD_SQL_INSTANCE: ''

options:
  # Bumped from the default e2-medium so the Testcontainers Postgres in the
  # integration step has headroom; the rest of the pipeline benefits too.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  env:
    - 'NODE_ENV=production'

steps:
  - id: install
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        npm ci --workspaces --include-workspace-root --no-audit --no-fund

  - id: secret-scan
    # Working-tree scan (--no-git): Cloud Build's checkout has no git history.
    # Add allowlist entries to .gitleaks.toml for known-safe placeholders.
    # Pinned to a release tag for reproducibility — bump deliberately when
    # rolling forward, never use `:latest` in CI.
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: gitleaks
    args:
      - detect
      - --redact
      - --no-git
      - --source=.
      - --config=.gitleaks.toml

  - id: lint
    name: node:22
    entrypoint: npm
    args: ['run', 'lint']

  - id: typecheck
    name: node:22
    entrypoint: npm
    args: ['run', 'typecheck']

  - id: test-unit
    name: node:22
    entrypoint: npm
    args: ['run', 'test:unit']

  - id: test-integration
    # Cloud Build mounts the host Docker socket only into `gcr.io/cloud-builders/*`
    # images, so we use cloud-builders/docker — the Google-maintained builder
    # that has the daemon access Testcontainers needs. Google publishes it
    # without per-version tags (latest is the documented consumption path); we
    # accept that rolling-release for the builder image specifically and pin
    # everything else (gitleaks, the gitleaks config, the NodeSource key
    # fingerprint, our own app images) for reproducibility.
    #
    # Node 22 is added via NodeSource's signed APT repo — Debian's recommended
    # pattern for third-party repos. The GPG key is fetched over TLS and then
    # checked against the published NodeSource fingerprint before being
    # trusted, so a compromised TLS endpoint can't silently swap it.
    # /workspace persists across Cloud Build steps, so `install`'s node_modules
    # are reused — no second `npm ci`.
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # NodeSource's long-lived release-signing key, published at
        # https://github.com/nodesource/distributions#installation-instructions.
        # Bump deliberately when NodeSource rotates the key.
        EXPECTED_KEY_FINGERPRINT="9FD3B784BC1C6FC31A8A0A1C1655A0AB68576280"
        apt-get update -qq
        apt-get install -qq -y --no-install-recommends ca-certificates curl gnupg
        install -m 0755 -d /etc/apt/keyrings
        TMP_KEY="$(mktemp)"
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key -o "$${TMP_KEY}"
        # Verify fingerprint before trusting the key (defense against a
        # compromised TLS endpoint or DNS hijack on deb.nodesource.com).
        ACTUAL_FINGERPRINT="$(gpg --show-keys --with-colons --with-fingerprint "$${TMP_KEY}" \
          | awk -F: '$1 == "fpr" {print $10; exit}')"
        if [ "$${ACTUAL_FINGERPRINT}" != "$${EXPECTED_KEY_FINGERPRINT}" ]; then
          echo "NodeSource GPG key fingerprint mismatch:" >&2
          echo "  expected: $${EXPECTED_KEY_FINGERPRINT}" >&2
          echo "  actual:   $${ACTUAL_FINGERPRINT}" >&2
          exit 1
        fi
        gpg --dearmor < "$${TMP_KEY}" > /etc/apt/keyrings/nodesource.gpg
        rm -f "$${TMP_KEY}"
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update -qq
        apt-get install -qq -y --no-install-recommends nodejs
        npm run test:integration --workspace @app/api

  - id: test-e2e
    # End-to-end Playwright suite. Brings up Postgres in a sidecar, runs
    # migrations, starts the dev API + dev web, then drives the live stack
    # through Playwright. Same flow as `npm run test:e2e --workspace @app/web`
    # locally.
    #
    # Like `test-integration`, this needs Docker socket access (for the
    # Postgres sidecar), so we use `gcr.io/cloud-builders/docker`. Node 22
    # is added via NodeSource APT with a pinned GPG fingerprint, mirroring
    # the integration-test step. Playwright browsers are installed via
    # `playwright install --with-deps` against the @playwright/test version
    # in package-lock.json.
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        EXPECTED_KEY_FINGERPRINT="9FD3B784BC1C6FC31A8A0A1C1655A0AB68576280"
        apt-get update -qq
        apt-get install -qq -y --no-install-recommends ca-certificates curl gnupg
        install -m 0755 -d /etc/apt/keyrings
        TMP_KEY="$(mktemp)"
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key -o "$${TMP_KEY}"
        ACTUAL_FINGERPRINT="$(gpg --show-keys --with-colons --with-fingerprint "$${TMP_KEY}" \
          | awk -F: '$1 == "fpr" {print $10; exit}')"
        if [ "$${ACTUAL_FINGERPRINT}" != "$${EXPECTED_KEY_FINGERPRINT}" ]; then
          echo "NodeSource GPG key fingerprint mismatch:" >&2
          echo "  expected: $${EXPECTED_KEY_FINGERPRINT}" >&2
          echo "  actual:   $${ACTUAL_FINGERPRINT}" >&2
          exit 1
        fi
        gpg --dearmor < "$${TMP_KEY}" > /etc/apt/keyrings/nodesource.gpg
        rm -f "$${TMP_KEY}"
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
          > /etc/apt/sources.list.d/nodesource.list
        apt-get update -qq
        apt-get install -qq -y --no-install-recommends nodejs

        # Postgres sidecar — shares the host network so the API can reach
        # it on localhost:5432 without configuring a private bridge.
        docker run -d --rm --name e2e-pg \
          -e POSTGRES_USER=app \
          -e POSTGRES_PASSWORD=app \
          -e POSTGRES_DB=${_DB_NAME} \
          --network host \
          postgres:17
        for i in $(seq 1 60); do
          if docker exec e2e-pg pg_isready -U app -d ${_DB_NAME} >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done

        # Install Playwright system deps + browsers (cached at /root/.cache/ms-playwright
        # if Cloud Build re-uses the volume across runs; otherwise re-fetched).
        (cd apps/web && npx --no-install playwright install --with-deps chromium firefox webkit)

        # API config — DB_HOST/DB_USER/DB_PASSWORD/DB_NAME match the
        # @app/api Zod env schema, JWT_SECRET is required at boot.
        export DB_HOST=localhost DB_PORT=5432 \
               DB_USER=app DB_PASSWORD=app DB_NAME=${_DB_NAME} \
               JWT_SECRET="e2e-only-secret-do-not-use-in-prod-1234"

        npm --workspace @app/api run migration:run
        npm --workspace @app/api run dev &
        API_PID=$!
        npm --workspace @app/web run dev &
        WEB_PID=$!
        for i in $(seq 1 90); do curl -sf http://localhost:8080/api/health && break || sleep 1; done
        for i in $(seq 1 90); do curl -sf http://localhost:5173 && break || sleep 1; done

        E2E_SKIP_WEBSERVER=1 \
          E2E_DB_HOST=localhost E2E_DB_PORT=5432 \
          E2E_DB_USER=app E2E_DB_PASSWORD=app E2E_DB_NAME=${_DB_NAME} \
          CI=true \
          npm --workspace @app/web run test:e2e

        kill "$${API_PID}" "$${WEB_PID}" || true
        docker rm -f e2e-pg || true

  - id: build-api-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA}
      - .

  - id: build-web-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${SHORT_SHA}
      - .

  - id: push-api-image
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA}']

  - id: push-web-image
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${SHORT_SHA}']

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        # Migration job mirrors the API service's identity, env, secrets, and
        # VPC connectivity so it can reach private Cloud SQL with IAM auth.
        API_SERVICE_ACCOUNT="${_API_SERVICE_ACCOUNT_ID}@$PROJECT_ID.iam.gserviceaccount.com"
        API_DB_USER="${_API_SERVICE_ACCOUNT_ID}@$PROJECT_ID.iam"
        gcloud run jobs deploy ${_MIGRATION_JOB_NAME} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA} \
          --region ${_REGION} \
          --command node \
          --args "apps/api/dist/main.js" \
          --service-account "$${API_SERVICE_ACCOUNT}" \
          --network ${_VPC_NAME} \
          --subnet ${_SUBNET_NAME} \
          --vpc-egress private-ranges-only \
          --set-env-vars "NODE_ENV=production,RUN_MIGRATIONS_ONLY=true,CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE},DB_USER=$${API_DB_USER},DB_NAME=${_DB_NAME}" \
          --set-secrets "JWT_SECRET=${_JWT_SECRET_NAME}:latest" \
          --task-timeout 600 \
          --max-retries 1 \
          --quiet
        gcloud run jobs execute ${_MIGRATION_JOB_NAME} --region ${_REGION} --wait

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        API_SERVICE_ACCOUNT="${_API_SERVICE_ACCOUNT_ID}@$PROJECT_ID.iam.gserviceaccount.com"
        API_DB_USER="${_API_SERVICE_ACCOUNT_ID}@$PROJECT_ID.iam"
        gcloud run deploy ${_API_SERVICE_NAME} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA} \
          --region ${_REGION} \
          --port 8080 \
          --allow-unauthenticated \
          --service-account "$${API_SERVICE_ACCOUNT}" \
          --network ${_VPC_NAME} \
          --subnet ${_SUBNET_NAME} \
          --vpc-egress private-ranges-only \
          --set-env-vars "NODE_ENV=production,CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE},DB_USER=$${API_DB_USER},DB_NAME=${_DB_NAME}" \
          --set-secrets "JWT_SECRET=${_JWT_SECRET_NAME}:latest,SENDGRID_API_KEY=${_SENDGRID_SECRET_NAME}:latest,EMAIL_FROM=${_EMAIL_FROM_SECRET_NAME}:latest" \
          --quiet

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        WEB_SERVICE_ACCOUNT="${_WEB_SERVICE_ACCOUNT_ID}@$PROJECT_ID.iam.gserviceaccount.com"
        API_UPSTREAM="$(gcloud run services describe ${_API_SERVICE_NAME} \
          --region ${_REGION} \
          --format='value(status.url)')"
        gcloud run deploy ${_WEB_SERVICE_NAME} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${SHORT_SHA} \
          --region ${_REGION} \
          --port 8080 \
          --allow-unauthenticated \
          --service-account "$${WEB_SERVICE_ACCOUNT}" \
          --set-env-vars "API_UPSTREAM=$${API_UPSTREAM}" \
          --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${SHORT_SHA}

timeout: 1800s
