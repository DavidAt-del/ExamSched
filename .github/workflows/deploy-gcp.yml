name: Deploy to GCP

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment that holds the GCP deployment variables
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      git_ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        default: main
        type: string
      confirm_production:
        description: Required safeguard for production deployments. Type "deploy" when environment=production.
        required: false
        default: ''
        type: string
      seed_profile:
        description: Seed profile for the Cloud SQL seed job. Use `none` to skip seeding.
        required: false
        default: none
        type: choice
        options:
          - none
          - demo
          - mocker
          - load
      confirm_seeded_production:
        description: Additional safeguard for production seed runs. Type "seed-production" only for an intentional controlled bootstrap load.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloud Build deploy
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.head_branch == 'main' ||
          github.event.workflow_run.head_branch == 'develop'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.event.workflow_run.head_sha }}

      - name: Guard production deploys
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.environment }}" = "production" ] && [ "${{ inputs.confirm_production }}" != "deploy" ]; then
            echo 'Production deployments require confirm_production=deploy.' >&2
            exit 1
          fi
          if [ "${{ inputs.environment }}" = "production" ] && [ "${{ inputs.seed_profile }}" != "none" ] && [ "${{ inputs.confirm_seeded_production }}" != "seed-production" ]; then
            echo 'Production seed runs require confirm_seeded_production=seed-production.' >&2
            exit 1
          fi

      - name: Validate required environment variables
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_AR_REPO: ${{ vars.GCP_AR_REPO }}
          GCP_DB_NAME: ${{ vars.GCP_DB_NAME }}
          GCP_API_SERVICE_ACCOUNT_ID: ${{ vars.GCP_API_SERVICE_ACCOUNT_ID }}
          GCP_WEB_SERVICE_ACCOUNT_ID: ${{ vars.GCP_WEB_SERVICE_ACCOUNT_ID }}
          GCP_API_SERVICE_NAME: ${{ vars.GCP_API_SERVICE_NAME }}
          GCP_WEB_SERVICE_NAME: ${{ vars.GCP_WEB_SERVICE_NAME }}
          GCP_MIGRATION_JOB_NAME: ${{ vars.GCP_MIGRATION_JOB_NAME }}
          GCP_VPC_NAME: ${{ vars.GCP_VPC_NAME }}
          GCP_SUBNET_NAME: ${{ vars.GCP_SUBNET_NAME }}
          GCP_JWT_SECRET_NAME: ${{ vars.GCP_JWT_SECRET_NAME }}
          GCP_SENDGRID_SECRET_NAME: ${{ vars.GCP_SENDGRID_SECRET_NAME }}
          GCP_EMAIL_FROM_SECRET_NAME: ${{ vars.GCP_EMAIL_FROM_SECRET_NAME }}
          GCP_CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
        run: |
          set -euo pipefail
          required=(
            GCP_PROJECT_ID
            GCP_REGION
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_SERVICE_ACCOUNT
            GCP_AR_REPO
            GCP_DB_NAME
            GCP_API_SERVICE_ACCOUNT_ID
            GCP_WEB_SERVICE_ACCOUNT_ID
            GCP_API_SERVICE_NAME
            GCP_WEB_SERVICE_NAME
            GCP_MIGRATION_JOB_NAME
            GCP_VPC_NAME
            GCP_SUBNET_NAME
            GCP_JWT_SECRET_NAME
            GCP_SENDGRID_SECRET_NAME
            GCP_EMAIL_FROM_SECRET_NAME
            GCP_CLOUD_SQL_INSTANCE
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub environment variables:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo "Populate them from terraform output and cloudbuild.substitutions.local.yaml." >&2
            exit 1
          fi

      - name: Compute build metadata
        id: meta
        shell: bash
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "deploy_sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${DEPLOY_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Submit Cloud Build pipeline
        shell: bash
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          SEED_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_profile || 'demo' }}
        run: |
          set -euo pipefail

          gcloud builds submit \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --config cloudbuild.yaml \
            --substitutions "SHORT_SHA=${SHORT_SHA},COMMIT_SHA=${{ steps.meta.outputs.deploy_sha }},_REGION=${{ vars.GCP_REGION }},_ENV=${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }},_SEED_PROFILE=${SEED_PROFILE},_AR_REPO=${{ vars.GCP_AR_REPO }},_DB_NAME=${{ vars.GCP_DB_NAME }},_API_SERVICE_ACCOUNT_ID=${{ vars.GCP_API_SERVICE_ACCOUNT_ID }},_WEB_SERVICE_ACCOUNT_ID=${{ vars.GCP_WEB_SERVICE_ACCOUNT_ID }},_API_SERVICE_NAME=${{ vars.GCP_API_SERVICE_NAME }},_WEB_SERVICE_NAME=${{ vars.GCP_WEB_SERVICE_NAME }},_MIGRATION_JOB_NAME=${{ vars.GCP_MIGRATION_JOB_NAME }},_VPC_NAME=${{ vars.GCP_VPC_NAME }},_SUBNET_NAME=${{ vars.GCP_SUBNET_NAME }},_JWT_SECRET_NAME=${{ vars.GCP_JWT_SECRET_NAME }},_SENDGRID_SECRET_NAME=${{ vars.GCP_SENDGRID_SECRET_NAME }},_EMAIL_FROM_SECRET_NAME=${{ vars.GCP_EMAIL_FROM_SECRET_NAME }},_CLOUD_SQL_INSTANCE=${{ vars.GCP_CLOUD_SQL_INSTANCE }}" \
            .
