# Example custom substitutions for a Cloud Build trigger in a different GCP project.
# Copy these values into the trigger configuration or pass them to `gcloud builds submit --substitutions`.
substitutions:
  _REGION: us-central1
  _AR_REPO: scheduler-images
  _ENV: staging
  _DB_NAME: scheduler
  _CLOUD_SQL_INSTANCE: your-gcp-project-id:us-central1:scheduler-staging-pg
  _API_SERVICE_ACCOUNT_ID: api-staging
  _API_SERVICE_NAME: api-staging
  _WEB_SERVICE_NAME: web-staging
  _MIGRATION_JOB_NAME: api-migrate-staging
  _VPC_NAME: scheduler-staging-vpc
  _SUBNET_NAME: scheduler-staging-subnet
  _JWT_SECRET_NAME: scheduler-staging-jwt-secret
  _SENDGRID_SECRET_NAME: scheduler-staging-sendgrid-api-key
  _EMAIL_FROM_SECRET_NAME: scheduler-staging-email-from

